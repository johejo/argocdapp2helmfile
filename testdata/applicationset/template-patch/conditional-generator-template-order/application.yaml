apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - list:
        elements:
          - name: enabled
            patch: true
          - name: disabled
            patch: false
        template:
          spec:
            destination:
              namespace: generator
            source:
              chart: generator-chart
  templatePatch: |
    {{- if .patch }}
    spec:
      destination:
        namespace: patched
      source:
        chart: patched-chart
    {{- end }}
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      destination:
        namespace: default
      source:
        repoURL: https://example.com/charts
        chart: base-chart
        targetRevision: 1.0.0
