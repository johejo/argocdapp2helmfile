apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: frontend
            directory: frontend
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: git@github.com:example/charts.git
        path: 'charts/{{ .directory }}'
        targetRevision: main
        helm:
          valueFiles:
            - environments/prod.yaml
