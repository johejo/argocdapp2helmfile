apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: empty-steps
spec:
  generators:
    - list:
        elements:
          - name: app
  strategy:
    type: RollingSync
    deletionOrder: Reverse
    rollingSync:
      steps: []
  template:
    metadata:
      name: '{{name}}'
    spec:
      source:
        repoURL: https://example.com/charts
        chart: service
        targetRevision: 1.0.0
