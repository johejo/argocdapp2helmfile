apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: database
            stage: foundation
            destination: production
            namespace: data
          - name: cache
            stage: foundation
            destination: staging
            namespace: cache
          - name: api
            stage: service
            destination: production
            namespace: apps
          - name: worker
            stage: service
            destination: staging
            namespace: jobs
          - name: frontend
            stage: edge
            destination: production
            namespace: web
  strategy:
    type: RollingSync
    deletionOrder: Reverse
    rollingSync:
      steps:
        - matchExpressions:
            - key: rollout-stage
              operator: In
              values: [foundation]
          maxUpdate: "100%"
        - matchExpressions:
            - key: rollout-stage
              operator: In
              values: [unused]
        - matchExpressions:
            - key: rollout-stage
              operator: In
              values: [service]
            - key: excluded
              operator: NotIn
              values: ["true"]
        - matchExpressions:
            - key: rollout-stage
              operator: In
              values: [edge]
  template:
    metadata:
      name: '{{ .name }}-application'
      labels:
        rollout-stage: '{{ .stage }}'
    spec:
      destination:
        name: '{{ .destination }}'
        namespace: '{{ .namespace }}'
      source:
        repoURL: https://example.com/charts
        chart: service
        targetRevision: 1.0.0
        helm:
          releaseName: '{{ .name }}-release'
