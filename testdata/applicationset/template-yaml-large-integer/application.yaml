apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: app
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: https://example.com/charts
        chart: app
        targetRevision: 1.2.3
        helm:
          values: |
            large: {{ (fromYaml "value: 18446744073709551615").value | toYaml }}
