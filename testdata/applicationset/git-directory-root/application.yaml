apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: directory-generator-root
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/example/config.git
        revision: main
        directories:
          - path: .
  template:
    metadata:
      name: root
    spec:
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.2.3
