apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: empty-child
spec:
  generators:
    - merge:
        mergeKeys: [name]
        generators:
          - list:
              elements:
                - name: first
          - list:
              elements: []
  template:
    metadata:
      name: '{{name}}'
    spec: {}
