apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: deeply-nested-combination
spec:
  generators:
    - merge:
        mergeKeys: [environment]
        generators:
          - matrix:
              generators:
                - merge:
                    mergeKeys: [environment]
                    generators:
                      - list:
                          elements:
                            - environment: dev
                      - list:
                          elements:
                            - environment: dev
                - list:
                    elements:
                      - region: east
          - list:
              elements:
                - environment: dev
  template:
    metadata:
      name: test
    spec:
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.0.0
