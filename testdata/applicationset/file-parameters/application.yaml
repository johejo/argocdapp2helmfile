apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: frontend
            config: frontend.json
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: git@github.com:example/charts.git
        path: charts/app
        targetRevision: main
        helm:
          fileParameters:
            - name: config
              path: 'files/{{ .config }}'
