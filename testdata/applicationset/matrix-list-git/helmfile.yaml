repositories:
  - name: source
    url: https://charts.example.com
helmDefaults:
  createNamespace: false
releases:
  - name: development
    namespace: dev
    chart: source/nginx
    version: 1.0.0
    values:
      - sourceFile: dev.yaml
        summary: dev/dev.yaml/nginx
  - name: production
    namespace: prod
    chart: source/redis
    version: 2.0.0
    values:
      - sourceFile: prod.yaml
        summary: prod/prod.yaml/redis
