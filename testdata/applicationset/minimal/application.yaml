apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: app
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: https://example.com/charts
        chart: chart
        targetRevision: 1.0.0
