apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-error
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - environment: dev
          - list:
              elements:
                - chart: nginx
                  version: 1.0.0
                - chart: redis
                  version: 2.0.0
  template:
    metadata:
      name: duplicate
    spec:
      destination:
        namespace: '{{ .environment }}'
      source:
        repoURL: https://charts.example.com
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
