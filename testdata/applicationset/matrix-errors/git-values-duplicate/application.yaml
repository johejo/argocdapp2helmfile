apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: duplicate-git-values
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - environment: dev
                  valuesKey: collision
          - git:
              repoURL: https://github.com/example/clusters.git
              revision: main
              files:
                - path: clusters/dev.yaml
              values:
                '{{ .valuesKey }}': '{{ .environment }}'
                collision: '{{ .path.filename }}'
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      destination:
        namespace: '{{ .environment }}'
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.0.0
