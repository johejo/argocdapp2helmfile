apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-error
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - name: nested
                - list:
                    elements:
                      - environment: dev
              template: {}
          - list:
              elements:
                - region: east
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.0.0
