apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-error
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - repository: https://github.com/example/apps.git
          - git:
              repoURL: '{{ .repository }}'
              revision: main
              files:
                - path: applications/*.yaml
              template:
                metadata:
                  name: '{{ .undefined }}'
  template:
    metadata:
      name: app
    spec:
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.0.0
