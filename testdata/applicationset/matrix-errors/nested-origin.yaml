apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-error
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - outer: outer
          - matrix:
              generators:
                - list:
                    elements:
                      - innerFirst: first
                - list:
                    elements:
                      - innerSecond: second
  template:
    metadata:
      name: nested-origin
      labels:
        '{{ .outer }}': outer
        '{{ printf "%s" .outer }}': duplicate
    spec:
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.0.0
