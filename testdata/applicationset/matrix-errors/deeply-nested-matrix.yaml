apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-error
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - matrix:
                    generators:
                      - list:
                          elements:
                            - name: too-deep
                      - list:
                          elements:
                            - environment: dev
                - list:
                    elements:
                      - region: east
          - list:
              elements:
                - cluster: local
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: https://charts.example.com
        chart: nginx
        targetRevision: 1.0.0
