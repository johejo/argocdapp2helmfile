repositories:
  - name: source
    url: https://charts.example.com
helmDefaults:
  createNamespace: false
releases:
  - name: in-alpha
    kubeContext: alpha-admin
    chart: source/example
    version: 1.2.3
  - name: not-in-beta
    kubeContext: beta-admin
    chart: source/example
    version: 1.2.3
  - name: exists-alpha
    kubeContext: alpha-admin
    chart: source/example
    version: 1.2.3
  - name: not-exists-beta
    kubeContext: beta-admin
    chart: source/example
    version: 1.2.3
