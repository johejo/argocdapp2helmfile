apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nested-selectors
spec:
  goTemplate: true
  applyNestedSelectors: false
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - environment: dev
                - list:
                    elements:
                      - name: selected
                        enabled: "true"
                      - name: ignored
                        enabled: "false"
            selector:
              matchLabels:
                enabled: "true"
          - list:
              elements:
                - chart: nginx
  template:
    metadata:
      name: '{{ .environment }}-{{ .name }}'
    spec:
      source:
        repoURL: https://charts.example.com
        chart: '{{ .chart }}'
        targetRevision: 1.0.0
