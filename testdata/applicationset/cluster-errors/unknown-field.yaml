apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters
spec:
  generators:
    - clusters:
        secretType: cluster
  template:
    metadata:
      name: '{{name}}'
    spec:
      destination:
        server: '{{server}}'
      source:
        repoURL: https://charts.example.com
        chart: example
        targetRevision: 1.2.3
