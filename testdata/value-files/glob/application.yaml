apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glob-app
  namespace: argocd
spec:
  project: production
  source:
    repoURL: git@example.com:charts.git
    path: chart
    targetRevision: main
    helm:
      valueFiles:
        - values/**/*.yaml
        - values/nested/*.yaml
        - values/b.yaml
        - values/00.yaml
        - values/00.yaml
