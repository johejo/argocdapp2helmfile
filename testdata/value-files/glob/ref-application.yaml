apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glob-app
  namespace: argocd
spec:
  project: production
  sources:
    - ref: values
      repoURL: git@example.com:values.git
      targetRevision: stable
    - repoURL: git@example.com:charts.git
      path: chart
      targetRevision: main
      helm:
        valueFiles:
          - $values/prod/$ARGOCD_APP_NAME*.yaml
