apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: static-environment
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - list:
        elements:
          - name: generated
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      source:
        repoURL: git@example.com:charts.git
        path: chart
        targetRevision: main
        helm:
          valueFiles:
            - env/$ARGOCD_APP_NAME.yaml
