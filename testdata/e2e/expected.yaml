apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-chart
  namespace: helm-release
  labels:
    app.kubernetes.io/name: local-chart
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: local-chart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-chart
    spec:
      containers:
        - name: frontend
          image: registry.invalid/team/frontend:v1.2.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-backend
  namespace: workloads
  labels:
    app.kubernetes.io/component: local-kustomization
  annotations:
    app.example.com/source-path: kustomize
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend
      app.kubernetes.io/component: local-kustomization
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/component: local-kustomization
      annotations:
        app.example.com/source-path: kustomize
    spec:
      containers:
        - name: backend
          image: registry.invalid/team/backend:v2.3.4
