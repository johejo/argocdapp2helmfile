apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
spec:
  source:
    repoURL: https://github.com/example/platform.git
    path: charts/api
    helm:
      valueFiles:
        - environments/$ARGOCD_APP_SOURCE_TARGET_REVISION.yaml
      parameters:
        - name: declared-revision
          value: source-${ARGOCD_APP_SOURCE_TARGET_REVISION}
  destination: {}
