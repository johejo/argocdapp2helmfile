apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omitted
spec:
  source:
    repoURL: https://example.com/charts
    chart: chart
    targetRevision: 1.2.3
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: false
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  source:
    repoURL: https://example.com/charts
    chart: chart
    targetRevision: 1.2.3
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inexact
spec:
  syncPolicy:
    syncOptions:
      - createNamespace=true
      - " CreateNamespace=true"
  source:
    repoURL: https://example.com/charts
    chart: chart
    targetRevision: 1.2.3
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enabled
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - CreateNamespace=true
  source:
    repoURL: https://example.com/charts
    chart: chart
    targetRevision: 1.2.3
