apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: from-repositories
spec:
  goTemplate: true
  generators:
    - scmProvider:
        github:
          organization: example
  template:
    metadata:
      name: '{{ .repository }}'
    spec:
      destination:
        namespace: default
      source:
        repoURL: https://example.com/charts
        chart: '{{ .repository }}'
        targetRevision: 1.0.0
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reporting
spec:
  revisionHistoryLimit: 0
  destination:
    namespace: analytics
  source:
    repoURL: https://example.com/charts
    chart: reporting
    targetRevision: 7.8.9
