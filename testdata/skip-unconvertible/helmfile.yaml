# skipped document 2: spec.generators[0].scmProvider generator is not supported: listing repositories requires querying a live SCM provider
# skipped document 4: spec.revisionHistoryLimit cannot be 0: Argo CD disables revision history, but Helmfile historyMax 0 means unlimited history
repositories:
  - name: charts
    url: https://example.com/charts
helmDefaults:
  createNamespace: false
releases:
  - name: frontend
    namespace: production
    chart: charts/frontend
    version: 1.2.3
  - name: worker
    namespace: background
    chart: charts/worker
    version: 4.5.6
  - name: gateway
    namespace: edge
    chart: charts/gateway
    version: 2.0.0
