# document 1 kustomization source: repoURL "https://github.com/example/platform.git", path "services/api", targetRevision "main"
helmDefaults:
  createNamespace: false
releases:
  - name: api
    namespace: workloads
    chart: 'checkouts/platform/services/api'
    transformers:
      - apiVersion: builtin
        kind: LabelTransformer
        metadata:
          name: argocd-common-labels
        labels:
          app.kubernetes.io/name: api
          app.kubernetes.io/part-of: production
          app.example.com/source-path: services/api
          unknown: before--after
        fieldSpecs:
          - path: spec/selector
            create: true
            version: v1
            kind: Service
          - path: spec/selector
            create: true
            version: v1
            kind: ReplicationController
          - path: spec/selector/matchLabels
            create: true
            kind: Deployment
          - path: spec/template/spec/affinity/podAffinity/preferredDuringSchedulingIgnoredDuringExecution/podAffinityTerm/labelSelector/matchLabels
            group: apps
            kind: Deployment
          - path: spec/template/spec/affinity/podAffinity/requiredDuringSchedulingIgnoredDuringExecution/labelSelector/matchLabels
            group: apps
            kind: Deployment
          - path: spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/podAffinityTerm/labelSelector/matchLabels
            group: apps
            kind: Deployment
          - path: spec/template/spec/affinity/podAntiAffinity/requiredDuringSchedulingIgnoredDuringExecution/labelSelector/matchLabels
            group: apps
            kind: Deployment
          - path: spec/template/spec/topologySpreadConstraints/labelSelector/matchLabels
            group: apps
            kind: Deployment
          - path: spec/selector/matchLabels
            create: true
            kind: ReplicaSet
          - path: spec/selector/matchLabels
            create: true
            kind: DaemonSet
          - path: spec/selector/matchLabels
            create: true
            group: apps
            kind: StatefulSet
          - path: spec/template/spec/affinity/podAffinity/preferredDuringSchedulingIgnoredDuringExecution/podAffinityTerm/labelSelector/matchLabels
            group: apps
            kind: StatefulSet
          - path: spec/template/spec/affinity/podAffinity/requiredDuringSchedulingIgnoredDuringExecution/labelSelector/matchLabels
            group: apps
            kind: StatefulSet
          - path: spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/podAffinityTerm/labelSelector/matchLabels
            group: apps
            kind: StatefulSet
          - path: spec/template/spec/affinity/podAntiAffinity/requiredDuringSchedulingIgnoredDuringExecution/labelSelector/matchLabels
            group: apps
            kind: StatefulSet
          - path: spec/template/spec/topologySpreadConstraints/labelSelector/matchLabels
            group: apps
            kind: StatefulSet
          - path: spec/selector/matchLabels
            group: batch
            kind: Job
          - path: spec/jobTemplate/spec/selector/matchLabels
            group: batch
            kind: CronJob
          - path: spec/selector/matchLabels
            group: policy
            kind: PodDisruptionBudget
          - path: spec/podSelector/matchLabels
            group: networking.k8s.io
            kind: NetworkPolicy
          - path: spec/ingress/from/podSelector/matchLabels
            group: networking.k8s.io
            kind: NetworkPolicy
          - path: spec/egress/to/podSelector/matchLabels
            group: networking.k8s.io
            kind: NetworkPolicy
          - path: metadata/labels
            create: true
          - path: spec/template/metadata/labels
            create: true
            version: v1
            kind: ReplicationController
          - path: spec/template/metadata/labels
            create: true
            kind: Deployment
          - path: spec/template/metadata/labels
            create: true
            kind: ReplicaSet
          - path: spec/template/metadata/labels
            create: true
            kind: DaemonSet
          - path: spec/template/metadata/labels
            create: true
            group: apps
            kind: StatefulSet
          - path: spec/volumeClaimTemplates[]/metadata/labels
            create: true
            group: apps
            kind: StatefulSet
          - path: spec/template/metadata/labels
            create: true
            group: batch
            kind: Job
          - path: spec/jobTemplate/metadata/labels
            create: true
            group: batch
            kind: CronJob
          - path: spec/jobTemplate/spec/template/metadata/labels
            create: true
            group: batch
            kind: CronJob
      - apiVersion: builtin
        kind: AnnotationsTransformer
        metadata:
          name: argocd-common-annotations
        annotations:
          app.example.com/application-namespace: argocd
          app.example.com/source: https://github.com/example/platform.git
          app.example.com/path: services/api
          app.example.com/revision: main
        fieldSpecs:
          - path: metadata/annotations
            create: true
          - path: spec/template/metadata/annotations
            create: true
            version: v1
            kind: ReplicationController
          - path: spec/template/metadata/annotations
            create: true
            kind: Deployment
          - path: spec/template/metadata/annotations
            create: true
            kind: ReplicaSet
          - path: spec/template/metadata/annotations
            create: true
            kind: DaemonSet
          - path: spec/template/metadata/annotations
            create: true
            group: apps
            kind: StatefulSet
          - path: spec/template/metadata/annotations
            create: true
            group: batch
            kind: Job
          - path: spec/jobTemplate/metadata/annotations
            create: true
            group: batch
            kind: CronJob
          - path: spec/jobTemplate/spec/template/metadata/annotations
            create: true
            group: batch
            kind: CronJob
